upstream glossa_api      { server fastapi_main:8000; }
upstream glossa_auth     { server django_app:8001; }
upstream glossa_ws       { server fastapi_websocket:8002; }
upstream glossa_storage  { server minio:9000; }

# Only upgrade the connection for real websocket handshakes; plain proxied
# requests must keep their normal Connection header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name glossa.best www.glossa.best;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name glossa.best www.glossa.best;

    ssl_certificate     /etc/letsencrypt/live/glossa.best/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glossa.best/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Audio replies and story uploads can be sizeable; the default 1m rejects them.
    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Django owns /api/auth/* and expects the full path, so this block must come
    # before the /api/ one and must not rewrite the URI.
    location /api/auth/ {
        proxy_pass http://glossa_auth;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else under /api/ is FastAPI, whose routers are mounted at the
    # root — the trailing slash in proxy_pass strips the /api prefix for them.
    location /api/ {
        proxy_pass http://glossa_api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://glossa_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        # AI turns can be slow; the 60s default would drop idle sockets mid-lesson.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Object storage for TTS audio, avatars and uploads. MINIO_PUBLIC_ENDPOINT
    # points here, so stored URLs stay on the main domain and inherit its TLS.
    location /files/ {
        proxy_pass http://glossa_storage/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback: any unknown path is a client-side route, not a 404.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
