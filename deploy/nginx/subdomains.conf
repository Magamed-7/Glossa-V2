# Поддомены glossa.best под остальные проекты.
#
# Сертификат общий с основным сайтом: одна выдача Let's Encrypt на пять имён
# (glossa.best, www, ometus, bonappetit, zarinpay), поэтому здесь тот же файл, что и в
# app.conf, и продлевается всё разом.
#
# Переменная $connection_upgrade объявлена в app.conf — оба файла лежат в одном
# http-контексте, так что map повторять не нужно.

upstream ometus_api      { server ometus-backend-1:8000; }
upstream ometus_web      { server ometus-frontend-1:80; }
upstream zarinpay_web    { server zarinpay-web-1:8000; }
upstream bonappetit_api  { server bonappetit-gateway-1:8000; }
upstream bonappetit_web  { server bonappetit-frontend-1:80; }

server {
    listen 80;
    server_name ometus.glossa.best bonappetit.glossa.best zarinpay.glossa.best;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ometus.glossa.best;

    ssl_certificate     /etc/letsencrypt/live/glossa.best/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glossa.best/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Подтверждение почты идёт по websocket (/api/auth/verification/...), поэтому здесь
    # нужны заголовки апгрейда.
    location /api/ {
        proxy_pass http://ometus_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /docs         { proxy_pass http://ometus_api; proxy_set_header Host $host; }
    location /openapi.json { proxy_pass http://ometus_api; proxy_set_header Host $host; }

    location / {
        proxy_pass http://ometus_web;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name bonappetit.glossa.best;

    ssl_certificate     /etc/letsencrypt/live/glossa.best/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glossa.best/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Шлюз сам разводит запросы по четырём сервисам, наружу торчит только он.
    # Отслеживание заказа в реальном времени — websocket через шлюз
    # (/api/orders/{id}/live), поэтому нужны заголовки апгрейда.
    location /api/ {
        proxy_pass http://bonappetit_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /webhooks/ {
        proxy_pass http://bonappetit_api;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://bonappetit_web;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name zarinpay.glossa.best;

    ssl_certificate     /etc/letsencrypt/live/glossa.best/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glossa.best/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Django отдаёт и страницы, и статику (whitenoise), поэтому отдельного корня нет.
    location / {
        proxy_pass http://zarinpay_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
