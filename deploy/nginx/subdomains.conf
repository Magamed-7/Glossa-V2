# Поддомены glossa.best под остальные проекты.
#
# Пока для этих имён нет DNS-записей и сертификата, поэтому здесь только 80-й порт:
# в таком виде nginx поднимается, а certbot сможет пройти проверку по
# /.well-known/acme-challenge/ сразу, как записи появятся. После выпуска сертификата
# эти блоки заменяются на редирект + 443, как у основного сайта.

upstream ometus_api      { server ometus-backend-1:8000; }
upstream ometus_web      { server ometus-frontend-1:80; }
upstream zarinpay_web    { server zarinpay-web-1:8000; }
upstream bonappetit_api  { server bonappetit-gateway-1:8000; }
upstream bonappetit_web  { server bonappetit-frontend-1:80; }

server {
    listen 80;
    server_name ometus.glossa.best;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    client_max_body_size 20m;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://ometus_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /docs      { proxy_pass http://ometus_api; proxy_set_header Host $host; }
    location /openapi.json { proxy_pass http://ometus_api; proxy_set_header Host $host; }

    location / {
        proxy_pass http://ometus_web;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name bonappetit.glossa.best;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    client_max_body_size 20m;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Шлюз сам разводит запросы по четырём сервисам, наружу торчит только он.
    location /api/ {
        proxy_pass http://bonappetit_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /webhooks/ {
        proxy_pass http://bonappetit_api;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://bonappetit_web;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name zarinpay.glossa.best;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    client_max_body_size 20m;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Django отдаёт и страницы, и статику (whitenoise), поэтому отдельного корня нет.
    location / {
        proxy_pass http://zarinpay_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
