# HTTP-only config used once, so certbot can answer the ACME challenge before
# any certificate exists. Replaced by app.conf as soon as the cert is issued.
server {
    listen 80;
    server_name glossa.best www.glossa.best;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Glossa is being set up.\n';
        add_header Content-Type text/plain;
    }
}
