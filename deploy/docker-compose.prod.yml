# Production stack for glossa.best.
#
# Deliberately trimmed against Backend/docker-compose.yml: Elasticsearch and the
# per-queue Celery workers are left out because this box has 8 GB of RAM and the
# JVM alone would eat a quarter of it. One Celery worker consumes every queue,
# which is equivalent for this load.
#
# Only the nginx container publishes ports. Databases, object storage and the
# app containers talk over the compose network and stay off the public internet.

name: glossa

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio_init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/avatars &&
      mc mb -p local/story-images &&
      mc mb -p local/pronunciations &&
      mc mb -p local/story-audio &&
      mc mb -p local/chat-attachments &&
      mc anonymous set download local/avatars &&
      mc anonymous set download local/story-images &&
      mc anonymous set download local/pronunciations &&
      mc anonymous set download local/story-audio &&
      mc anonymous set download local/chat-attachments
      "

  django_app:
    build:
      context: ../Backend
      dockerfile: docker/Dockerfile.django
    restart: unless-stopped
    env_file: ../Backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    working_dir: /app/auth_service
    command: >
      gunicorn auth_service.wsgi:application
      --bind 0.0.0.0:8001 --workers 3 --timeout 60 --access-logfile -
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  fastapi_main:
    build:
      context: ../Backend
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: ../Backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    command: >
      gunicorn app.main:app -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile -
    # The seed scripts read the course JSON from an absolute /contents path, and
    # the corpus is too big to bake into every image.
    volumes:
      - ../contents:/contents:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  fastapi_websocket:
    build:
      context: ../Backend
      dockerfile: docker/Dockerfile.ws
    restart: unless-stopped
    env_file: ../Backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    # Long-lived sockets are stateful, so this one stays a single uvicorn process
    # rather than being spread across gunicorn workers.
    command: >
      uvicorn websocket_app.main:app --host 0.0.0.0 --port 8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ../Backend
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    env_file: ../Backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    command: >
      celery -A app.celery_app worker --loglevel=info --concurrency=2
      -Q celery,priority_queue,content_queue,notifications_queue,ai_queue,analytics_queue,payments_queue
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ../Backend
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    env_file: ../Backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    # The image runs as a non-root user and /app is root-owned, so beat's default
    # ./celerybeat-schedule is unwritable and it crash-loops on start.
    command: celery -A app.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy

  telegram_bot:
    build:
      context: ../Backend
      dockerfile: docker/Dockerfile.bot
    restart: unless-stopped
    env_file: ../Backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_URL: https://glossa.best/api
        VITE_AUTH_URL: https://glossa.best
        VITE_WS_URL: wss://glossa.best
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - fastapi_main
      - django_app
      - fastapi_websocket

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Renewal check twice a day is the interval Let's Encrypt recommends; the
    # cert itself is only replaced inside its last 30 days.
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  certbot_conf:
  certbot_www:
