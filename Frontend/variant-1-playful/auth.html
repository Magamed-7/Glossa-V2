<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glossa — Вход</title>
<link rel="stylesheet" href="styles.css">
<style>
  body{ display:flex; align-items:center; justify-content:center; padding:var(--space-5); }
  .auth-wrap{ width:100%; max-width:420px; }
  .auth-logo{ display:flex; flex-direction:column; align-items:center; gap:var(--space-3); margin-bottom:var(--space-6); text-align:center; }
  .auth-logo .logo{ width:64px; height:64px; font-size:28px; }
  .auth-tabs{ display:flex; gap:8px; margin-bottom:var(--space-5); background:var(--color-muted); padding:6px; border-radius:var(--radius-pill); border:3px solid var(--color-border); }
  .auth-tabs .tab{ flex:1; border:none; box-shadow:none; }
  .auth-tabs .tab.active{ box-shadow:var(--shadow-clay-sm); }
  .auth-foot{ text-align:center; margin-top:var(--space-5); font-size:14px; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-logo">
    <span class="logo">G</span>
    <h1 class="mb-0">Glossa</h1>
    <p class="mb-0 text-muted">Учи язык через слова, истории и живой ИИ-разговор</p>
  </div>

  <div class="card">
    <div class="tabs auth-tabs" data-tabs="auth" role="tablist">
      <button class="tab active" role="tab" aria-selected="true" data-tab="login">Вход</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="register">Регистрация</button>
    </div>

    <div class="tab-panel active" data-panel="login" data-tabs-group="auth">
      <form onsubmit="return false">
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="login-pass">Пароль</label>
          <input id="login-pass" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <a href="#" class="text-muted" style="font-size:13px;">Забыли пароль?</a>
        <button class="btn btn-primary btn-block" style="margin-top:var(--space-5);" onclick="window.location.href='dashboard.html'">Войти</button>
      </form>
    </div>

    <div class="tab-panel" data-panel="register" data-tabs-group="auth">
      <form onsubmit="return false">
        <div class="field">
          <label for="reg-name">Имя</label>
          <input id="reg-name" type="text" autocomplete="name" placeholder="Амина Рахимова" required>
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="reg-pass">Пароль</label>
          <input id="reg-pass" type="password" autocomplete="new-password" placeholder="Минимум 8 символов" required>
          <span class="hint">Используй буквы, цифры и хотя бы один спецсимвол</span>
        </div>
        <button class="btn btn-primary btn-block" style="margin-top:var(--space-3);" onclick="window.location.href='onboarding.html'">Создать аккаунт</button>
      </form>
    </div>
  </div>

  <p class="auth-foot text-muted">Продолжая, вы принимаете условия использования Glossa</p>
</div>
<script src="app.js"></script>
</body>
</html>
