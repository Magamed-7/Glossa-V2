<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glossa — Повторение</title>
<link rel="stylesheet" href="styles.css">
<style>
  .review-topbar{ display:flex; align-items:center; gap:var(--space-4); }
  .review-progress{ flex:1; height:12px; background:var(--color-muted); border-radius:var(--radius-pill); overflow:hidden; border:3px solid var(--color-border); }
  .review-progress i{ display:block; height:100%; background:var(--color-accent); border-radius:var(--radius-pill); transition:width .4s var(--ease-bounce); }
  .flashcard .example{ font-size:15px; color:var(--color-muted-foreground); margin-top:var(--space-2); }
  .flashcard .translation{ font-family:var(--font-display); font-size:22px; color:var(--color-primary); }
  .audio-btn{ margin:0 auto var(--space-2); }
  .prompt-hint{ color:var(--color-muted-foreground); font-size:14px; }
  .flashcard.is-revealed .reveal-btn{ display:none; }
  .done-panel{ display:none; text-align:center; padding:var(--space-7) 0; }
  .done-panel.active{ display:block; }
  .done-panel svg{ width:72px; height:72px; color:var(--color-accent); margin-bottom:var(--space-3); }
</style>
</head>
<body class="app-shell" data-page="deck">
<div id="rail-root"></div>
<main class="app-main">
  <div id="topbar-root"></div>

  <div class="review-topbar">
    <a href="deck.html" class="icon-btn" aria-label="Закрыть повторение"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    <div class="review-progress"><i id="progress-bar" style="width:0%"></i></div>
    <span class="text-muted" id="progress-label">0/8</span>
  </div>

  <div class="flashcard-stage" id="review-stage">
    <div class="flashcard" id="flashcard">
      <span class="prompt-hint">Нажми «Показать перевод», чтобы открыть карточку</span>
      <span class="word" id="card-word">reluctant</span>
      <button class="icon-btn audio-btn" aria-label="Прослушать произношение" onclick="event.stopPropagation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>
      </button>
      <button class="btn btn-secondary reveal-btn" id="reveal-btn" type="button">Показать перевод</button>
      <div class="reveal">
        <div class="translation" id="card-translation">неохотный</div>
        <p class="example" id="card-example">She was reluctant to leave her hometown.</p>
      </div>
    </div>

    <div class="quality-scale" id="quality-scale" hidden>
      <button class="quality-btn" data-q="1">Совсем забыл</button>
      <button class="quality-btn" data-q="2">С трудом</button>
      <button class="quality-btn" data-q="3">Вспомнил</button>
      <button class="quality-btn" data-q="4">Легко</button>
    </div>
  </div>

  <div class="done-panel" id="done-panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
    <h2>Повторение завершено!</h2>
    <p>Ты повторил(а) 8 карточек. Retention сегодня — 87%.</p>
    <a href="dashboard.html" class="btn btn-primary">Вернуться на главную</a>
  </div>
</main>
<div id="bottomnav-root"></div>
<script src="app.js"></script>
<script>
  var deck = [
    { word: 'reluctant', translation: 'неохотный', example: 'She was reluctant to leave her hometown.' },
    { word: 'wander', translation: 'бродить', example: 'We wandered through the old town for hours.' },
    { word: 'commitment', translation: 'обязательство', example: 'Learning a language takes real commitment.' },
    { word: 'overwhelmed', translation: 'подавленный', example: 'He felt overwhelmed by the new vocabulary.' },
    { word: 'bittersweet', translation: 'горько-сладкий', example: 'Graduation day was a bittersweet moment.' },
    { word: 'linger', translation: 'задерживаться', example: 'The smell of coffee lingered in the kitchen.' },
    { word: 'achieve', translation: 'достигать', example: 'You can achieve fluency with daily practice.' },
    { word: 'thrive', translation: 'процветать', example: 'Some learners thrive with spaced repetition.' }
  ];
  var i = 0;
  var card = document.getElementById('flashcard');
  var qualityScale = document.getElementById('quality-scale');
  var progressBar = document.getElementById('progress-bar');
  var progressLabel = document.getElementById('progress-label');
  var stage = document.getElementById('review-stage');
  var donePanel = document.getElementById('done-panel');

  function loadCard() {
    var c = deck[i];
    document.getElementById('card-word').textContent = c.word;
    document.getElementById('card-translation').textContent = c.translation;
    document.getElementById('card-example').textContent = c.example;
    card.classList.remove('is-revealed');
    qualityScale.hidden = true;
    progressBar.style.width = Math.round((i / deck.length) * 100) + '%';
    progressLabel.textContent = i + '/' + deck.length;
  }

  function reveal() {
    card.classList.add('is-revealed');
    qualityScale.hidden = false;
  }
  document.getElementById('reveal-btn').addEventListener('click', reveal);

  qualityScale.querySelectorAll('.quality-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      i++;
      if (i >= deck.length) {
        progressBar.style.width = '100%';
        progressLabel.textContent = deck.length + '/' + deck.length;
        stage.style.display = 'none';
        donePanel.classList.add('active');
      } else {
        loadCard();
      }
    });
  });

  loadCard();
</script>
</body>
</html>
